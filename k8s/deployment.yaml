apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgitcoder
  namespace: webgitcoder
  labels:
    app: webgitcoder
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webgitcoder
  template:
    metadata:
      labels:
        app: webgitcoder
    spec:
      containers:
      - name: webgitcoder
        image: localhost:5000/webgitcoder:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: TZ
          value: "UTC"
      restartPolicy: Always
