apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webgitcoder
  namespace: webgitcoder
  labels:
    app: webgitcoder
  annotations:
    # Traefik annotations para reescritura de rutas
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Middleware para strip prefix si es necesario
    # traefik.ingress.kubernetes.io/router.middlewares: webgitcoder-stripprefix@kubernetescrd
spec:
  tls:
  - hosts:
    - northr3nd.duckdns.org
    secretName: northr3nd-tls
  rules:
  - host: northr3nd.duckdns.org
    http:
      paths:
      - path: /webgitcoder
        pathType: Prefix
        backend:
          service:
            name: webgitcoder
            port:
              number: 80
